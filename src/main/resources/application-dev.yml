spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./db_dev;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  sql:
    init:
      mode: always
      data-locations:
        - classpath:/db/category.sql
        - classpath:/db/subcategory.sql
        - classpath:/db/taxonomy.sql
        - classpath:/db/disposal.sql
        - classpath:/db/analysis-example.sql
        - classpath:/db/trash-example.sql

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    defer-datasource-initialization: true

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: ${custom.dev.rabbitmq.host:localhost}
    port: 5672
    username: ${custom.dev.rabbitmq.username:test}
    password: ${custom.dev.rabbitmq.password:1234}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE
    org.springframework.transaction.interceptor: TRACE

file:
  upload-dir: ${custom.dev.uploadDir:./upload/}
  external-path: ${custom.dev.externalPath:./external/}

analysis:
  fastApi:
    url: ${custom.dev.fastApiUrl:http://localhost:8989}

jwt:
  secret: ${custom.security.jwt.secret:ZiF5Qkeoy20Fk/iVa3MiQyc50tz5sm7S2i6UER7QkAo=}
  expiry:
    access: 3600
    refresh: 604800

security:
  cookie:
    sameSite: None
    domain: localhost

  cors:
    origins:
      - http://localhost:3000
    methods:
      - GET
      - POST
      - OPTIONS
    headers:
      - "*"
    path: /**
    maxAge: 3600
