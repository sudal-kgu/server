spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${custom.prod.db.url}
    username: ${custom.prod.db.username}
    password: ${custom.prod.db.password}
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: create

  rabbitmq:
    host: ${custom.prod.rabbitmq.host}
    port: ${custom.prod.rabbitmq.port}
    username: ${custom.prod.rabbitmq.username}
    password: ${custom.prod.rabbitmq.password}

file:
  upload-dir: ${custom.prod.uploadDir}
  external-path: ${custom.prod.externalPath}

analysis:
  fastApi:
    url: ${custom.prod.fastApiUrl}

jwt:
  secret: ${custom.jwt.secret}
  expiry:
    access: 3600

security:
  cookie:
    sameSite: Lax
    domain: .sonyk9919.store

  cors:
    origins:
      - https://sonyk9919.store:20024
      - http://localhost:3000
      - http://localhost:5173
    methods:
      - GET
      - POST
      - DELETE
      - PUT
      - OPTIONS
    headers:
      - Content-Type
    path: /**
    maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health