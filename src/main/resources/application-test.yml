spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:

  sql:
    init:
      mode: always
      data-locations:
        - classpath:/db/category.sql
        - classpath:/db/subcategory.sql
        - classpath:/db/taxonomy.sql

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG

file:
  upload-dir: ./upload/

analysis:
  fastApi:
    url: http://localhost:8989

jwt:
  secret: ZiF5Qkeoy20Fk/iVa3MiQyc50tz5sm7S2i6UER7QkAo=
  expiry:
    access: 3600

security:
  cookie:
    sameSite: None
    domain: localhost

  cors:
    origins:
      - http://localhost:3000
    methods:
      - GET
      - POST
      - OPTIONS
    headers:
      - "*"
    path: /**
    maxAge: 3600
